openapi: 3.0.3
info:
  title: Lesson 1 API
  version: 1.0.0
paths:
  /version:
    get:
      operationId: getVersion
      summary: Версия сервиса (сгенерированный образец)
      responses:
        "200":
          description: версия
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  # ═══ ШАГ 3. Новая ручка в контракте ══════════════════════════════════
  # Раскомментируйте блок ниже (уберите # в начале строк, отступы не трогайте),
  # затем выполните: go generate ./...
  # После этого сборка упадет - компилятор потребует реализовать CreateItem.
  # Это шаг 4, каркас ждет в internal/api/server.go.
  # ═════════════════════════════════════════════════════════════════════
  # /items:
  #   post:
  #     operationId: createItem
  #     requestBody:
  #       required: true
  #       content:
  #         application/json:
  #           schema:
  #             $ref: "#/components/schemas/ItemCreate"
  #     responses:
  #       "201":
  #         description: created
  #         content:
  #           application/json:
  #             schema:
  #               $ref: "#/components/schemas/Item"
components:
  schemas:
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
    Item:
      type: object
      required: [id, title]
      properties:
        id:
          type: integer
        title:
          type: string
    ItemCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
